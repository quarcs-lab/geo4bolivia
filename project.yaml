# Package identity, bundled into the wheel. See TEMPLATE.md.
# Everything generic in the package reads its settings from here; inside a checkout
# of the data repository, that repository's own project.yaml is read instead.

name: GeoDevelopment Observatory of Bolivia
short_name: GDO-Bolivia

# Python package (import name), CLI command and prefix of the environment
# variables (GEO4BOLIVIA_DATA_DIR, GEO4BOLIVIA_BASE_URL, GEO4BOLIVIA_REF).
package: geo4bolivia

# GitHub repository holding the published files (the data repository), and the git ref
# an installed package reads from by default (a release tag freezes the data).
repository: quarcs-lab/gdo4bolivia
default_ref: main

# The observatory's website, and this package's documentation.
website: https://quarcs-lab.github.io/gdo4bolivia/
documentation: https://quarcs-lab.github.io/geo4bolivia/

# How to cite the observatory. Every dataset's citations (geo.cite(), the dataset's README,
# its page on the website) list the original sources first, then this, then the other sources.
citation:
  apa: "Mendez, C. (2026). GeoDevelopment Observatory of Bolivia. https://quarcs-lab.github.io/gdo4bolivia/"
  bibtex: |-
    @misc{gdobolivia2026,
      author       = {Mendez, Carlos},
      title        = {{GeoDevelopment Observatory of Bolivia}},
      year         = {2026},
      howpublished = {\url{https://quarcs-lab.github.io/gdo4bolivia/}},
      note         = {Data and code: https://github.com/quarcs-lab/gdo4bolivia}
    }

country:
  name: Bolivia
  iso2: BO     # prefix of every geo_id
  iso3: BOL    # GADM country code (GID_0)

# Equal-area projection for areas, crosswalk weights and overlays.
# An Albers equal-area projection fitted to Bolivia (standard parallels 11°S and 21°S).
equal_area_crs: "+proj=aea +lat_0=-16.5 +lon_0=-64.5 +lat_1=-11 +lat_2=-21 +datum=WGS84 +units=m +no_defs"

# Default view of the package's interactive maps.
map:
  center: {lat: -16.3, lon: -64.0}
  zoom: 4

# Generated table listing every variable of every dataset.
catalog: definitions_gdo-bolivia.csv

# Boundaries of each dataset's wide GeoJSON (data/<dataset>/<scale>/<dataset>_wide.geojson), with
# {scale}: lighter outlines for web maps. The wide GeoPackage keeps geo/boundaries/.
wide_geojson_boundaries: "site/data/{scale}.geojson"
